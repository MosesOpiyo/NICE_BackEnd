name: Deploy Django Project to Server

on:
  push:
    branches:
      - ft-development  # Trigger deployment on this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Match your Django project’s Python version

      - name: Install dependencies locally
        run: |
          python -m venv venv  # Set up a virtual environment in GitHub Actions
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install cython
          pip install -r requirements.txt

      - name: Configure SSH
        run: |
            mkdir -p ~/.ssh
            printf "%s" "$SSH_KEY" > ~/.ssh/id_rsa  # Use printf for exact content
            chmod 700 ~/.ssh  # Set correct permissions for .ssh directory
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H <your_server_ip_or_hostname> >> ~/.ssh/known_hosts
        
      - name: Run Django Commands on Server
        run: |
            ssh <your_username>@<your_server_ip_or_hostname> << 'EOF'
              source /home/<your_username>/virtualenv/NiceDirectCoffeeAPI/3.10/bin/activate
              cd /NiceDirectCoffeeAPI/
              python manage.py makemigrations
              python manage.py migrate
              python manage.py collectstatic --noinput
            EOF
        shell: /usr/bin/bash -e {0}
        env:
            SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.DJANGO_SERVER }}
          username: ${{ secrets.DJANGO_USERNAME }}
          password: ${{ secrets.DJANGO_PASSWORD }}
          protocol: sftp
          local-dir: ./
          server-dir: /NiceDirectCoffeeAPI/
          exclude: |
            .git
            __pycache__
            venv
            .github
          dangerous-clean-slate: false
