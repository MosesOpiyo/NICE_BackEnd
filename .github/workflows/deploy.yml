name: Deploy Django Project to Server

on:
  push:
    branches:
      - ft-development  # Trigger deployment on this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Match your Django project’s Python version

      - name: Install dependencies locally
        run: |
          python -m venv venv  # Set up a virtual environment in GitHub Actions
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations and collect static files remotely
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DJANGO_SERVER }} >> ~/.ssh/known_hosts

          # SSH into the server, activate the virtualenv, and run Django commands
          ssh ${{ secrets.DJANGO_USERNAME }}@${{ secrets.DJANGO_SERVER }} << EOF
            source /home/jsmcbcqt/virtualenv/NiceDirectCoffeeAPI/3.10/bin/activate
            cd /NiceDirectCoffeeAPI/
            python manage.py makemigrations
            python manage.py migrate
            python manage.py collectstatic --noinput
          EOF

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.DJANGO_SERVER }}
          username: ${{ secrets.DJANGO_USERNAME }}
          password: ${{ secrets.DJANGO_PASSWORD }}
          protocol: sftp
          local-dir: ./
          server-dir: /NiceDirectCoffeeAPI/
          exclude: |
            .git
            __pycache__
            venv
            .github
          dangerous-clean-slate: false
