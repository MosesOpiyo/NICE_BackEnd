name: Deploy Django Project to Server

on:
  push:
    branches:
      - ft-development  # Trigger deployment on this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'  # Match your Django project’s Python version

      - name: Install dependencies
        run: |
          source /virtualenv/NiceDirectCoffeeAPI/3.10/bin/activate
          pip install -r requirements.txt

      - name: Run Migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Collect Static Files
        run: |
          source /virtualenv/NiceDirectCoffeeAPI/3.10/bin/activate
          python manage.py collectstatic --noinput

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.DJANGO_SERVER }}
          username: ${{ secrets.DJANGO_USERNAME }}
          password: ${{ secrets.DJANGO_PASSWORD }}
          protocol: sftp
          local-dir: ./
          server-dir: /NiceDirectCoffeeAPI/
          exclude: |
            .git
            __pycache__
            NICE
            staticfiles  # Or any specific folders to exclude
          dangerous-clean-slate: false
