name: Deploy Django API to cPanel

on:
  push:
    branches:
      - main  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Sync files with cPanel
        env:
          USER: ${{ secrets.CPANEL_USER }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PROJECT_PATH: ${{ secrets.CPANEL_PROJECT_PATH }}
        run: |
          rsync -avz --exclude '__pycache__' \
                     --exclude '.git' \
                     --exclude '.github' \
                     -e "ssh -o StrictHostKeyChecking=no" \
                     ./ $USER@$HOST:$PROJECT_PATH

      - name: Run Migrations and Restart Server
        env:
          USER: ${{ secrets.CPANEL_USER }}
          HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          source $HOME/virtualenv/python3.8/bin/activate  # Adjust if needed
          cd $PROJECT_PATH
          python manage.py migrate
          python manage.py collectstatic --noinput
          # Add your server restart command here, if needed
          EOF